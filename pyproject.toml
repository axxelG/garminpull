[tool.poetry]
name = "garminpull"
version = "0.1.0"
description = "Pull activities (pool swims and more) from Garmin Connect and save them in the format of your choice."
authors = ["Axel Gluth <axel@familiegluth.de>"]
readme = "README.md"
packages = [{ include = "garminpull" }]

[tool.poetry.dependencies]
python = "^3.10"
garminconnect = "^0.2.25"
typer = ">=0.15.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.6.0"

[tool.poetry.scripts]
garminpull = "garminpull.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
